name: Release desktop

# Builds the desktop installers and attaches them to a draft GitHub Release:
#   macOS    Citizen-Sampler-<version>-mac.pkg (universal: app, AU, VST3)
#   Windows  Citizen-Sampler-<version>-windows-setup.exe (app, VST3)
# Triggered by pushing a desktop version tag that matches the version in
# engine/CMakeLists.txt, e.g.:
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
# Can also be run by hand from the Actions tab. Pull requests that touch the
# desktop build run it too, unsigned, as a build check. Runs without a tag
# upload the installers as workflow artifacts instead of making a release.
#
# Signing turns on once the secrets exist; without them the installers are
# unsigned, which is enough to check the build. The Apple and Azure secrets
# use the same names as up-and-running's release workflow.
on:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "engine/**"
      - "installer/**"
      - "scripts/package-mac.sh"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch:

env:
  JUCE_VERSION: "8.0.12"

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the engine version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -nE 's/^project\(CitizenSamplerEngine VERSION ([0-9.]+).*/\1/p' engine/CMakeLists.txt)
          if [[ "${GITHUB_REF_NAME#desktop-v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match engine version $version"
            exit 1
          fi

      - name: Check out JUCE
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: JUCE

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-next/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-next/pnpm-lock.yaml

      - name: Install tools and frontend dependencies
        run: |
          brew install ninja
          pnpm --dir frontend-next install --frozen-lockfile

      # Imports both Developer ID certificates into a throwaway keychain.
      #   APPLE_CERTIFICATE                     Developer ID Application .p12, base64
      #   APPLE_CERTIFICATE_PASSWORD
      #   APPLE_SIGNING_IDENTITY                "Developer ID Application: Doggett Systems LLC (9B9573H63M)"
      #   APPLE_INSTALLER_CERTIFICATE           Developer ID Installer .p12, base64
      #   APPLE_INSTALLER_CERTIFICATE_PASSWORD
      #   APPLE_INSTALLER_IDENTITY              "Developer ID Installer: Doggett Systems LLC (9B9573H63M)"
      #   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8   App Store Connect API key, for notarizing
      - name: Prepare Apple signing
        if: github.event_name != 'pull_request'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT" ]]; then
            echo "::warning::No Apple certificate: this Mac build is unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          import() { # base64 p12, password
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$2" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/cert.p12"
          }
          import "$CERT" "$CERT_PASSWORD"
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$INSTALLER_CERT" ]]; then
            import "$INSTALLER_CERT" "$INSTALLER_CERT_PASSWORD"
            echo "MAC_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if [[ -n "$API_KEY_P8" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
            printf '%s' "$API_KEY_P8" > "$key_path"
            {
              echo "APPLE_API_KEY_PATH=$key_path"
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_ISSUER=$API_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      - name: Build, sign and notarize the installer
        env:
          JUCE_DIR: ${{ github.workspace }}/JUCE
        run: scripts/package-mac.sh

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Citizen Sampler desktop ${{ github.ref_name }}
          files: dist/*.pkg

      - name: Upload as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.pkg

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Windows signing turns on once the Azure app registration's secrets
      # exist; without them the Windows build stays unsigned.
      AZURE_SIGNING: ${{ github.event_name != 'pull_request' && secrets.AZURE_CLIENT_SECRET != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Read the engine version
        run: |
          version=$(sed -nE 's/^project\(CitizenSamplerEngine VERSION ([0-9.]+).*/\1/p' engine/CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#desktop-v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match engine version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check out JUCE
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: JUCE

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-next/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-next/pnpm-lock.yaml

      - name: Export the web UI
        working-directory: frontend-next
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_BASE_URL: https://api.citizensampler.com
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # JUCE links WebView2's loader statically, from the NuGet package
      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:RUNNER_TEMP\nuget"

      - name: Build the app and plugin
        run: |
          cmake -S engine -B engine/build-win -G "Visual Studio 17 2022" -A x64 \
            -DCITIZEN_BUILD_JUCE=ON -DCITIZEN_BUILD_TESTS=OFF \
            -DJUCE_DIR="$GITHUB_WORKSPACE/JUCE" \
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$RUNNER_TEMP/nuget" \
            -DCITIZEN_UI_DIR="$GITHUB_WORKSPACE/frontend-next/out"
          cmake --build engine/build-win --config Release \
            --target CitizenSampler_Standalone CitizenSampler_VST3

      # Azure Artifact Signing, as in up-and-running. The secret behind
      # AZURE_CLIENT_SECRET expires; renew it in Entra ID under App
      # registrations.
      - name: Install Windows signing tool
        if: env.AZURE_SIGNING == 'true'
        run: cargo install trusted-signing-cli --locked

      - name: Sign the app and plugin
        if: env.AZURE_SIGNING == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          artefacts=engine/build-win/juce/CitizenSampler_artefacts/Release
          for file in "$artefacts/Standalone/Citizen Sampler.exe" \
                      "$artefacts/VST3/Citizen Sampler.vst3/Contents/x86_64-win/Citizen Sampler.vst3"; do
            trusted-signing-cli -e https://eus.codesigning.azure.net/ -a doggett-codesigning \
              -c doggett-systems-public -d "Citizen Sampler" "$file"
          done

      - name: Build the installer
        shell: pwsh
        run: |
          $artefacts = "$env:GITHUB_WORKSPACE\engine\build-win\juce\CitizenSampler_artefacts\Release"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=$env:VERSION `
            "/DArtefacts=$artefacts" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" installer\windows\CitizenSampler.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the installer
        if: env.AZURE_SIGNING == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          trusted-signing-cli -e https://eus.codesigning.azure.net/ -a doggett-codesigning \
            -c doggett-systems-public -d "Citizen Sampler" dist/*-setup.exe

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Citizen Sampler desktop ${{ github.ref_name }}
          files: dist/*-setup.exe

      - name: Upload as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe
